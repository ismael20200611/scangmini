<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>پشکنەری CG - رووداو</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .top-bar h1 {
            font-size: 0.9rem;
            color: #38bdf8;
        }

        .api-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #475569;
            color: #fff;
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            width: 140px;
            direction: ltr;
        }

        .camera-container {
            position: relative;
            flex: 1;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scanner-frame {
            position: absolute;
            width: 85%;
            height: 35%;
            border: 2px dashed #38bdf8;
            border-radius: 12px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scanner-frame span {
            background: rgba(0, 0, 0, 0.6);
            color: #94a3b8;
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .bottom-card {
            position: absolute;
            bottom: 20px;
            left: 16px;
            right: 16px;
            z-index: 20;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            padding: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.7);
            border: 2px solid #334155;
            transition: all 0.3s ease;
        }

        .status-clean {
            border-color: #10b981 !important;
            background: rgba(6, 78, 59, 0.95) !important;
        }

        .status-error {
            border-color: #ef4444 !important;
            background: rgba(127, 29, 29, 0.95) !important;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .badge {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background-color: #38bdf8;
            border-radius: 50%;
            animation: pulse 1.2s infinite;
        }

        .result-text {
            font-size: 0.95rem;
            line-height: 1.5;
            white-space: pre-wrap;
            max-height: 120px;
            overflow-y: auto;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .btn-live {
            background: #0284c7;
            color: white;
        }

        .btn-live.active {
            background: #ef4444;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <h1>پشکنەری رووداو (v2.0)</h1>
        <input type="password" id="apiKey" class="api-input" placeholder="Gemini API Key..." onchange="saveKey()">
    </div>

    <div class="camera-container">
        <video id="video" playsinline autoplay muted></video>
        <div class="scanner-frame">
            <span>تێکستی CG بخەرە ئەم چوارچێوەیە</span>
        </div>
    </div>

    <div class="bottom-card" id="bottomCard">
        <div class="card-header">
            <span class="badge" id="statusBadge">چاوەڕوانی کامێرا...</span>
            <div class="pulse-dot" id="pulseDot" style="display: none;"></div>
        </div>
        <div class="result-text" id="resultText">مۆبایلەکەت بەرامبەر تێکستی CG ڕابگرە.</div>
        <div class="controls">
            <button class="btn btn-live" id="btnToggle" onclick="toggleScanner()">دەستپێکردنی پشکنینی راستەوخۆ</button>
        </div>
    </div>

    <canvas id="canvas" style="display: none;"></canvas>

<script>
    let isScanning = false;
    let isProcessing = false;
    let videoStream = null;
    let detectedModel = null; // مۆدێلی دۆزراوە بۆ کلیلەکەت
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const btnToggle = document.getElementById('btnToggle');
    const statusBadge = document.getElementById('statusBadge');
    const resultText = document.getElementById('resultText');
    const bottomCard = document.getElementById('bottomCard');
    const pulseDot = document.getElementById('pulseDot');

    document.addEventListener("DOMContentLoaded", () => {
        const savedKey = localStorage.getItem("rudaw_gemini_api_key");
        if (savedKey) document.getElementById("apiKey").value = savedKey;
        initCamera();
    });

    function saveKey() {
        const key = document.getElementById("apiKey").value.trim();
        localStorage.setItem("rudaw_gemini_api_key", key);
        detectedModel = null; // دووبارە دۆزینەوەی مۆدێل بە کلیلە نوێیەکە
    }

    async function initCamera() {
        try {
            videoStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } },
                audio: false
            });
            video.srcObject = videoStream;
            statusBadge.innerText = "ئامادەیە بۆ پشکنین";
        } catch (err) {
            statusBadge.innerText = "هەڵە لە کامێرا";
            resultText.innerText = "تکایە ڕێگە بە کامێرا بدە لە وێبگەڕەکەتدا.";
        }
    }

    // دۆزینەوەی ئۆتۆماتیکی ئەو مۆدێلە فەرمییەی بۆ کلیلەکەت کاردەکات
    async function getWorkingModel(apiKey) {
        if (detectedModel) return detectedModel;

        statusBadge.innerText = "دۆزینەوەی مۆدێل...";
        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
            const data = await res.json();
            
            if (data.models && data.models.length > 0) {
                // گەڕان بەدوای مۆدێلێکی گونجاو (وەک 2.5, 2.0, یان flash)
                const suitable = data.models.find(m => 
                    m.supportedGenerationMethods && 
                    m.supportedGenerationMethods.includes('generateContent') &&
                    (m.name.includes('flash') || m.name.includes('gemini'))
                );

                if (suitable) {
                    detectedModel = suitable.name.replace('models/', '');
                    return detectedModel;
                }
            }
        } catch (e) {
            console.error("نەتوانرا مۆدێلەکان بهێنرێن:", e);
        }

        // ئەگەر لیستی مۆدێلەکان نەهاتن، ئەمە بەکاردێت:
        detectedModel = 'gemini-2.0-flash';
        return detectedModel;
    }

    async function toggleScanner() {
        const apiKey = document.getElementById("apiKey").value.trim();
        if (!apiKey) {
            alert("تکایە سەرەتا کلیلی API لە سەرەوە بنووسە!");
            return;
        }

        isScanning = !isScanning;
        if (isScanning) {
            btnToggle.innerText = "وەستاندنی پشکنین";
            btnToggle.classList.add("active");
            pulseDot.style.display = "block";
            runScannerLoop();
        } else {
            btnToggle.innerText = "دەستپێکردنی پشکنینی راستەوخۆ";
            btnToggle.classList.remove("active");
            pulseDot.style.display = "none";
            statusBadge.innerText = "وەستێنراوە";
        }
    }

    async function runScannerLoop() {
        if (!isScanning) return;

        if (!isProcessing) {
            isProcessing = true;
            statusBadge.innerText = "خەریکی پشکنینە...";
            
            try {
                const base64Image = captureFrame();
                const apiKey = document.getElementById("apiKey").value.trim();
                const result = await callGemini(apiKey, base64Image);
                const cleaned = postProcessText(result);
                displayLiveResult(cleaned);
            } catch (error) {
                resultText.innerText = error.message;
                // ئەگەر کێشەی نادۆزرانەوە بوو، ڕێنمایی VPN پیشان دەدات
                if (error.message.includes("not found")) {
                    resultText.innerText += "\n\n⚠️ تێبینی: تکایە VPN لەسەر مۆبایلەکەت پێبکە و دووبارە تاقی بکەرەوە (لە عێراق گووگڵ پێویستی بە VPN دەبێت).";
                }
            } finally {
                isProcessing = false;
            }
        }

        if (isScanning) {
            setTimeout(runScannerLoop, 1500);
        }
    }

    function captureFrame() {
        const ctx = canvas.getContext('2d');
        canvas.width = 640;
        canvas.height = 360;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL('image/jpeg', 0.65).split(',')[1];
    }

    async function callGemini(apiKey, base64Image) {
        const modelName = await getWorkingModel(apiKey);

        const systemPrompt = `تۆ پشکنەری رێنووسی زمانی کوردی سۆرانییت لە کەناڵی "رووداو".
کارەکەت بریتییە لە دۆزینەوەی هەڵەی رێنووسی لەسەر تێکستی CG.

یاساکانی رووداو:
١. پیتەکانی (ڕ) و (ڵ) لە سەرەتای وشەدا قەدەغەیە، دەبێت بە پیتی (ر) بنووسرێن (وەک: رووداو، رێگە، رۆژ، راپۆرت).
٢. پیتەکانی عەرەبی (ي، ك، ه لە شوێنی ە) قەدەغەیە، تەنیا پیتە کوردییەکان: (ی، ک، ە، ێ، ۆ، ڤ، گ، چ، پ، ژ).
٣. پێشگری کردار (دە/دەست) و پاشگرەکان بەپێی ستانداردی رووداو بن.

شێوازی وەڵامدانەوە (زۆر کورت):
ئەگەر دروست بوو:
سەدی سەد دروستە ✅

ئەگەر هەڵەی تێدابوو:
هەڵە: (وشە هەڵەکە) ⬅️ (وشە دروستەکە بەپێی رووداو)`;

        const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;

        const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{
                    parts: [
                        { text: systemPrompt },
                        { inlineData: { mimeType: "image/jpeg", data: base64Image } }
                    ]
                }]
            })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);
        return data.candidates[0].content.parts[0].text;
    }

    function postProcessText(text) {
        return text.replace(/\bڕ/g, "ر").replace(/ي/g, "ی").replace(/ك/g, "ک");
    }

    function displayLiveResult(text) {
        resultText.innerText = text;
        if (text.includes("سەدی سەد دروستە") || text.includes("✅")) {
            bottomCard.className = "bottom-card status-clean";
            statusBadge.innerText = "سەدی سەد دروستە ✅";
        } else {
            bottomCard.className = "bottom-card status-error";
            statusBadge.innerText = "هەڵە هەیە ⚠️";
        }
    }
</script>

</body>
</html>
