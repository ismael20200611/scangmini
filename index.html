<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>پشکنەری CG - شێوازی رووداو</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            text-align: center;
            padding: 10px 0;
            border-bottom: 1px solid #334155;
        }

        header h1 {
            font-size: 1.4rem;
            color: #38bdf8;
            margin-bottom: 4px;
        }

        header p {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        /* بەشی کلیلی API */
        .api-section {
            background: #1e293b;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .api-section label {
            font-size: 0.8rem;
            color: #cbd5e1;
        }

        .api-section input {
            background: #0f172a;
            border: 1px solid #475569;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            direction: ltr;
        }

        /* دوگمەی وێنەگرتن */
        .btn-capture {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            border: none;
            padding: 18px 24px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .btn-capture:active {
            transform: scale(0.98);
        }

        #fileInput {
            display: none;
        }

        /* بەشی پیشاندانی ئەنجام */
        .result-box {
            display: none;
            padding: 18px;
            border-radius: 12px;
            font-size: 1rem;
            line-height: 1.6;
            animation: fadeIn 0.3s ease;
        }

        .status-clean {
            background-color: #064e3b;
            border: 2px solid #10b981;
            color: #ecfdf5;
        }

        .status-error {
            background-color: #7f1d1d;
            border: 2px solid #ef4444;
            color: #fef2f2;
        }

        .status-badge {
            display: inline-block;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .output-content {
            white-space: pre-wrap;
            font-size: 1.05rem;
        }

        /* لۆدینگ */
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #334155;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px auto;
        }

        .timer {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 6px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>پشکنەری CG - شێوازی رووداو</h1>
        <p>پشکنینی خێرای رێنووس لە ماوەی کەمتر لە ١٠ چرکە</p>
    </header>

    <!-- ڕێکخستنی کلیلی API -->
    <div class="api-section">
        <label for="apiKey">Gemini API Key (تەنیا یەکجار دایبنێ):</label>
        <input type="password" id="apiKey" placeholder="AIzaSy..." onchange="saveApiKey()">
    </div>

    <!-- دوگمەی کامێرا -->
    <input type="file" id="fileInput" accept="image/*" capture="environment">
    <button class="btn-capture" onclick="document.getElementById('fileInput').click()">
        📷 وێنەی شاشەی CG بگرە
    </button>

    <!-- لۆدینگ لە کاتی پشکنیندا -->
    <div class="loading" id="loadingBox">
        <div class="spinner"></div>
        <p id="loadingText">خەریکی شیکردنەوەیە بەپێی شێوازی رووداو...</p>
        <div class="timer" id="timer">٠.٠ چرکە</div>
    </div>

    <!-- ئەنجام -->
    <div class="result-box" id="resultBox">
        <div class="status-badge" id="statusBadge"></div>
        <div class="output-content" id="outputContent"></div>
    </div>
</div>

<script>
    // هێنانی کلیل لە مۆبایلەکە ئەگەر پێشتر سەیڤ کرابێت
    document.addEventListener("DOMContentLoaded", () => {
        const savedKey = localStorage.getItem("rudaw_gemini_api_key");
        if (savedKey) {
            document.getElementById("apiKey").value = savedKey;
        }
    });

    function saveApiKey() {
        const key = document.getElementById("apiKey").value.trim();
        localStorage.setItem("rudaw_gemini_api_key", key);
    }

    const fileInput = document.getElementById('fileInput');
    fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const apiKey = document.getElementById("apiKey").value.trim();
        if (!apiKey) {
            alert("تکایە سەرەتا Gemini API Key دابنێ!");
            return;
        }

        // دەستپێکردنی کاتژمێر
        startLoading();

        try {
            // بچووککردنەوەی وێنەکە بۆ خێرایی ئەپلۆد (Compress)
            const base64Image = await compressImage(file, 1080);
            
            // ناردن بۆ مۆدێلی Gemini Flash
            const resultText = await callGeminiFlash(apiKey, base64Image);
            
            // پشکنینی پیتەکان بە کۆدیش بۆ دڵنیایی زیاتر
            const cleanedText = postProcessText(resultText);
            
            showResult(cleanedText);
        } catch (error) {
            alert("کێشەیەک ڕوویدا: " + error.message);
        } finally {
            stopLoading();
        }
    });

    // بچووککردنەوەی وێنە بۆ ئەوەی خێرا بە 4G بنێردرێت
    function compressImage(file, maxDimension) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxDimension) {
                            height *= maxDimension / width;
                            width = maxDimension;
                        }
                    } else {
                        if (height > maxDimension) {
                            width *= maxDimension / height;
                            height = maxDimension;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.75).split(',')[1]);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    // پەیوەندی کردن بە Gemini 1.5 Flash
    async function callGeminiFlash(apiKey, base64Image) {
        const systemPrompt = `تۆ پشکنەری رێنووسی زمانی کوردی سۆرانییت لە کەناڵی "رووداو".
کارەکەت بریتییە لە دۆزینەوەی هەڵەی رێنووسی لەسەر شاشەی مۆنیتەری کۆنتڕۆڵ رووم (CG Preview).

یاسا زۆر توندەکانی رووداو:
١. لە شێوازی رووداو پیتەکانی (ڕ) و (ڵ) بە هیچ جۆرێک لە سەرەتای وشە نانووسرێن، بەڵکو دەبێت بە پیتی (ر) بنووسرێن (وەک: رووداو، رێگە، رۆژ، راپۆرت نەک ڕووداو یان ڕێگە).
٢. پیتەکانی عەرەبی قەدەغەیە (ي، ك، ه لە شوێنی ە). تەنیا پیتە کوردییەکان: (ی، ک، ە، ێ، ۆ، ڤ، گ، چ، پ، ژ).
٣. وشەکان بە کوردی بن (بۆ نموونە: ئادەم دروستە، نەک ئادهم).
٤. رێنووسی ژمارەکان و ناوی کەسایەتی و شوێنەکان بەپێی ستانداردی رووداو.

شێوازی وەڵامدانەوە:
ئەگەر هیچ هەڵەی نەبوو، تەنیا ئەم رستەیە بنووسە:
سەدی سەد دروستە ✅

ئەگەر هەڵەی تێدابوو، بەم شێوەیە کورت بنووسە:
هەڵە هەیە ⚠️
دەقی دروست: (تێکستی دروستکراو بەپێی رووداو)
هەڵەکان:
- (وشە هەڵەکە) ⬅️ (وشە دروستەکە)`;

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{
                    parts: [
                        { text: systemPrompt },
                        {
                            inline_data: {
                                mime_type: "image/jpeg",
                                data: base64Image
                            }
                        }
                    ]
                }]
            })
        });

        const data = await response.json();
        if (data.candidates && data.candidates[0].content) {
            return data.candidates[0].content.parts[0].text;
        } else {
            throw new Error("پاسەردانەوە بەردەست نەبوو یان کلیلەکە هەڵەیە.");
        }
    }

    // فلتەری زیاتری کۆد بۆ پیتی ڕ لە سەرەتای وشە و پیتەکانی عەرەبی
    function postProcessText(text) {
        return text
            .replace(/\bڕ/g, "ر") // هەر ڕ یەک لە سەرەتای وشە بێت دەیکاتە ر
            .replace(/ي/g, "ی")
            .replace(/ك/g, "ک");
    }

    // پیشاندانی ئەنجام لە شاشە
    function showResult(text) {
        const resultBox = document.getElementById("resultBox");
        const statusBadge = document.getElementById("statusBadge");
        const outputContent = document.getElementById("outputContent");

        resultBox.style.display = "block";

        if (text.includes("سەدی سەد دروستە") || text.includes("✅")) {
            resultBox.className = "result-box status-clean";
            statusBadge.innerText = "سەدی سەد دروستە ✅";
            outputContent.innerText = "تێکستەکە پاکە و دەتوانیت بیخەیتە سەر پەخش.";
        } else {
            resultBox.className = "result-box status-error";
            statusBadge.innerText = "هەڵە هەیە ⚠️";
            outputContent.innerText = text;
        }
    }

    // تایمەر
    let timerInterval;
    let startTime;

    function startLoading() {
        document.getElementById("loadingBox").style.display = "block";
        document.getElementById("resultBox").style.display = "none";
        startTime = Date.now();
        timerInterval = setInterval(() => {
            const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
            document.getElementById("timer").innerText = `${elapsed} چرکە`;
        }, 100);
    }

    function stopLoading() {
        document.getElementById("loadingBox").style.display = "none";
        clearInterval(timerInterval);
    }
</script>

</body>
</html>
